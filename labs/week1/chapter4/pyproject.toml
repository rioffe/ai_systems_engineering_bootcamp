[project]
name = "rag-eval"
version = "0.1.0"
description = "Chapter 4 evaluation harness for the Chapter 3 RAG pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.20",
  "loguru>=0.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gui = ["PyQt5>=5.15", "pytest-qt>=4.4"]

[project.scripts]
rag-eval = "rag_eval.cli:main"
rag-eval-gui = "rag_eval.ui:run_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonPath = ".venv/bin/python3"
extraPaths = ["src"]
include = ["src", "tests"]
reportMissingImports = "none"
