[project]
name = "rag"
version = "0.1.0"
description = "RAG pipeline: dense + hybrid retrieval, rerank, expand, contextualize, cited generation, metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.20",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
rag = "rag.app:main"
rag-gui = "rag.app:main_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonPath = ".venv/bin/python3"
extraPaths = ["src"]
include = ["src", "tests"]
reportMissingImports = "none"
