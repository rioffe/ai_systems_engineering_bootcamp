[project]
name = "monte-carlo-pi"
version = "0.1.0"
description = "PyQt5 + matplotlib GUI that estimates π via the Monte Carlo (unit-square / quarter-circle) method with live convergence visualization."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Runtime dependencies (see SPEC.md § "Dependencies & Environment" for rationale)
dependencies = [
    "PyQt5>=5.15,<6",
    "matplotlib>=3.8",
    "numpy>=1.26,<3",
]

[project.scripts]
monte-carlo-pi = "monte_carlo_pi.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monte_carlo_pi"]

[tool.uv]
# Project is a source layout under src/
package = true

[tool.pytest.ini_options]
# GUI tests use Qt's offscreen platform via tests/conftest.py (SPEC E-11).
testpaths = ["tests"]

[tool.ruff.lint]
# The worker's top-level `except Exception` is intentional: it must surface any
# fault to the UI (SPEC E-07) rather than let the thread abort silently.
ignore = ["BLE001"]
