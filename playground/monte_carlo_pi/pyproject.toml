[project]
name = "monte-carlo-pi"
version = "0.1.0"
description = "Monte Carlo Pi estimation with a PyQt5 + matplotlib GUI"
readme = "README.md"
authors = [
    { name = "Robert Ioffe", email = "robert.ioffe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "PyQt5>=5.15",
    "matplotlib>=3.8",
]

[project.scripts]
monte-carlo-pi = "monte_carlo_pi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
